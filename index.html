        </header>

        <!-- 메인 콘텐츠 영역 -->
        <main id="main-content" class="flex-1 overflow-y-auto pb-20 bg-slate-50">

        <!-- 하단 네비게이션바 -->

            <button onclick="switchTab('home')" class="nav-btn flex flex-col items-center transition-all duration-200 active:scale-95" data-tab="home">

            <button onclick="switchTab('search')" class="nav-btn flex flex-col items-center transition-all duration-200 active:scale-95" data-tab="search">

            <button onclick="switchTab('write')" class="nav-btn flex flex-col items-center transition-all duration-200 active:scale-95" data-tab="write">

            </button>
            <button onclick="switchTab('chat')" class="nav-btn flex flex-col items-center transition-all duration-200 active:scale-95" data-tab="chat">

            <button onclick="switchTab('mypage')" class="nav-btn flex flex-col items-center transition-all duration-200 active:scale-95" data-tab="mypage">

        let currentFilter = 'all'; // all, request, share, rent

        // 초기 예시 게시글 데이터
        let posts = JSON.parse(localStorage.getItem('nanumi_posts')) || [

                place: '종합강의동 앞',

            {

                place: '공학관 3호관',

                content: '새 책처럼 깨끗합니다. 중앙도서관 앞에서 직거래 가능해요!',
                place: '중앙도서관 앞',
                datetime: '오늘 오후 4시',
                status: '진행중',
                author: '화학과만렙',
                likes: 5,
                createdAt: '2026-09-27 15:20',
                comments: []
            }
        ];

        let chats = JSON.parse(localStorage.getItem('nanumi_chats')) || [
            {
                id: 1,
                postId: 2,
                postTitle: '공학용 계산기(FX-570ES) 대여해드립니다.',
                partner: '공대고인물',
                lastMessage: '네 공학관 앞에서 2시에 뵙겠습니다!',
                messages: [
                    { sender: '나눔왕', text: '안녕하세요! 계산기 아직 대여 가능할까요?', time: '14:10' },
                    { sender: '공대고인물', text: '네 가능합니다! 언제 필요하세요?', time: '14:12' },
                    { sender: '나눔왕', text: '내일 오후 2시 어떠신가요?', time: '14:15' },
                    { sender: '공대고인물', text: '네 공학관 앞에서 2시에 뵙겠습니다!', time: '14:16' }
                ]
            }
        ];

        function saveData() {
            localStorage.setItem('nanumi_posts', JSON.stringify(posts));
            localStorage.setItem('nanumi_chats', JSON.stringify(chats));
            localStorage.setItem('nanumi_user', JSON.stringify(currentUser));
        }

        // 앱 초기 실행 진입점
        window.onload = function() {
            if (!currentUser) {
                renderAuthScreen();
            } else {
                switchTab('home');
            }
        };

        // 로그인 / 회원가입 화면
        function renderAuthScreen() {
            document.getElementById('bottom-nav').classList.add('hide');
            let univOptions = koreanUniversities.map(u => `<option value="${u}">${u}</option>`).join('');
            
            let html = `
                <div class="p-6 flex flex-col justify-between h-full animate-fade-in">
                    <div class="my-auto py-8">
                        <div class="text-center mb-8">
                            <div class="w-20 h-20 bg-gradient-to-tr from-emerald-500 to-teal-400 text-white rounded-3xl flex items-center justify-center mx-auto mb-4 shadow-xl shadow-emerald-500/30 ring-8 ring-emerald-50">
                                <i class="fa-solid fa-hands-holding-child text-4xl"></i>
                            </div>
                            <h1 class="text-2xl font-extrabold text-gray-900 tracking-tight">캠퍼스나누미</h1>
                            <p class="text-xs text-emerald-600 font-semibold mt-1">우리 학교 학생들끼리 나누는 교내 물품 공유 플랫폼</p>
                        </div>

                        <div class="space-y-4 bg-white p-6 rounded-2xl shadow-xl border border-slate-100">
                            <div>
                                <label class="block text-xs font-bold text-gray-700 mb-1.5"><i class="fa-solid fa-user mr-1.5 text-emerald-600"></i>닉네임</label>
                                <input type="text" id="auth-nickname" placeholder="사용할 닉네임을 입력하세요" class="w-full p-3.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-700 mb-1.5"><i class="fa-solid fa-school mr-1.5 text-emerald-600"></i>소속 대학교</label>
                                <select id="auth-univ" class="w-full p-3.5 border border-slate-200 rounded-xl text-sm bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition">
                                    ${univOptions}
                                </select>
                            </div>
                            <button onclick="handleRegister()" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-emerald-600/30 hover:from-emerald-700 hover:to-teal-700 transition active:scale-[0.98] mt-2 text-sm">캠퍼스나누미 시작하기</button>

            `;
            document.getElementById('main-content').innerHTML = html;
        }

        function handleRegister() {
            const nickname = document.getElementById('auth-nickname').value.trim();
            const university = document.getElementById('auth-univ').value;

            if (!nickname) {
                alert('사용하실 닉네임을 입력해주세요!');
                return;
            }

            currentUser = { nickname, university };
            saveData();
            document.getElementById('bottom-nav').classList.remove('hide');
            switchTab('home');
        }

        // 탭 전환 제어
        function switchTab(tabName) {
            if (!currentUser) {
                renderAuthScreen();
                return;
            }
            currentTab = tabName;
            document.getElementById('bottom-nav').classList.remove('hide');

            document.querySelectorAll('.nav-btn').forEach(btn => {
                if(btn.dataset.tab === tabName) {
                    btn.classList.add('text-emerald-600');
                    btn.classList.remove('text-gray-400');
                } else {
                    btn.classList.remove('text-emerald-600');
                    btn.classList.add('text-gray-400');
                }
            });

            if (tabName === 'home') renderHome();
            else if (tabName === 'search') renderSearch();
            else if (tabName === 'write') renderWrite();
            else if (tabName === 'chat') renderChatList();
            else if (tabName === 'mypage') renderMyPage();
        }

            const filteredPosts = currentFilter === 'all' ? univPosts : univPosts.filter(p => p.category === currentFilter);

            let html = `

                    <div class="flex space-x-1.5 bg-slate-200/70 p-1.5 rounded-2xl text-xs font-semibold mb-4 shadow-inner">

                        <button onclick="setFilter('request')" class="flex-1 py-2 rounded-xl transition-all duration-200 ${currentFilter==='request'?'bg-white text-amber-700 shadow-md font-bold':'text-slate-600 hover:text-slate-900'}">필요요청</button>
                        <button onclick="setFilter('rent')" class="flex-1 py-2 rounded-xl transition-all duration-200 ${currentFilter==='rent'?'bg-white text-blue-700 shadow-md font-bold':'text-slate-600 hover:text-slate-900'}">물품대여</button>

                    </div>

                    <!-- 게시글 목록 -->
                    <div class="space-y-3">
            `;

            if(filteredPosts.length === 0) {
                html += `
                    <div class="text-center py-20 bg-white rounded-2xl border border-slate-100 shadow-sm p-6">
                        <div class="w-16 h-16 bg-slate-100 text-slate-400 rounded-full flex items-center justify-center mx-auto mb-3">
                            <i class="fa-solid fa-box-open text-3xl"></i>
                        </div>
                        <p class="text-sm font-bold text-slate-700">등록된 물품 공유 글이 없습니다.</p>
                        <p class="text-xs text-slate-400 mt-1">하단 [+] 버튼을 눌러 첫 게시글을 올려보세요!</p>
                    </div>
                `;
            } else {
                filteredPosts.forEach(post => {
                    let badgeClass = 'bg-amber-50 text-amber-700 border-amber-200';
                    let badgeText = '필요요청';

        function submitPost() {
            const category = document.getElementById('write-category').value;
            const title = document.getElementById('write-title').value.trim();
            const content = document.getElementById('write-content').value.trim();
            const place = document.getElementById('write-place').value.trim();
            const datetime = document.getElementById('write-datetime').value.trim();

            if(!title || !content || !place) {
                alert('제목, 상세 내용, 만날 장소를 모두 입력해주세요!');
                return;
            }

            const newPost = {
                id: Date.now(),
                university: currentUser.university,
                category,
                title,
                content,
                place,
                datetime: datetime || '상시 협의',
                status: '진행중',
                author: currentUser.nickname,
                likes: 0,
                createdAt: new Date().toISOString().slice(0, 16).replace('T', ' '),
                comments: []
            };

            posts.unshift(newPost);
            saveData();
            alert('게시글이 성공적으로 등록되었습니다!');
            switchTab('home');
        }

        function addComment(postId) {
            const input = document.getElementById('comment-input');
            if(!input.value.trim()) return;

            const post = posts.find(p => p.id === postId);
            post.comments.push({ author: currentUser.nickname, text: input.value.trim() });
            saveData();
            openDetail(postId);
        }

        function toggleStatus(postId) {
            const post = posts.find(p => p.id === postId);
            post.status = post.status === '진행중' ? '해결완료' : '진행중';
            saveData();
            openDetail(postId);
        }

        function deletePost(postId) {
            if(confirm('정말 이 게시글을 삭제하시겠습니까?')) {
                posts = posts.filter(p => p.id !== postId);
                saveData();
                switchTab('home');
            }
        }

        // 5. 1:1 실시간 채팅 기능
        function startChatWithAuthor(partnerName, postId, postTitle) {
            let existingChat = chats.find(c => c.postId === postId && c.partner === partnerName);
            if(!existingChat) {
                existingChat = {
                    id: Date.now(),
                    postId,
                    postTitle,
                    partner: partnerName,
                    lastMessage: '대화가 시작되었습니다.',
                    messages: [
                        { sender: partnerName, text: `안녕하세요! "${postTitle}" 게시글 보고 대여/나눔 문의드립니다.`, time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) }
                    ]
                };
                chats.unshift(existingChat);
                saveData();
            }
            openChatRoom(existingChat.id);
        }

        function renderChatList() {
            document.getElementById('header-title').innerText = "1:1 채팅 목록";
            let html = `<div class="p-4 space-y-3 animate-fade-in">`;

            if(chats.length === 0) {
                html += `

        function openChatRoom(chatId) {
            const chat = chats.find(c => c.id === chatId);
            document.getElementById('header-title').innerText = `${chat.partner}님과 대화방`;

            let msgHtml = '';
            chat.messages.forEach(m => {
                const isMe = m.sender === currentUser.nickname;
                msgHtml += `
                    <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'} mb-3">
                        <span class="text-[9px] text-slate-400 mb-0.5 px-1 font-medium">${m.sender}</span>
                        <div class="max-w-[78%] p-3 rounded-2xl text-xs ${isMe ? 'bg-gradient-to-r from-emerald-600 to-teal-600 text-white rounded-br-none shadow-md shadow-emerald-600/20' : 'bg-white text-slate-800 rounded-bl-none border border-slate-200 shadow-sm'}">
                            ${m.text}
                        </div>
                        <span class="text-[8px] text-slate-400 mt-1 px-1">${m.time}</span>
                    </div>
                `;
            });

            let html = `
                <div class="flex flex-col h-[calc(100vh-110px)] md:h-[calc(92vh-120px)] justify-between bg-slate-50 animate-fade-in">
                    <div class="py-2.5 bg-emerald-50 border-b border-emerald-100 text-[11px] text-emerald-900 flex justify-between items-center px-4 font-semibold">

                    </div>
                    <div id="chat-scroll" class="flex-1 p-4 overflow-y-auto space-y-1">
                        ${msgHtml}
                    </div>
                    <div class="p-3 bg-white border-t border-slate-200 flex space-x-2">
                        <input type="text" id="chat-input" onkeyup="if(event.key==='Enter') sendMessage(${chat.id})" placeholder="만날 장소와 시간을 협의해보세요..." class="flex-1 p-3 border border-slate-200 rounded-xl text-xs bg-slate-50 focus:bg-white focus:ring-2 focus:ring-emerald-500 outline-none">
                        <button onclick="sendMessage(${chat.id})" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 rounded-xl text-xs font-bold shadow-md transition active:scale-95"><i class="fa-solid fa-paper-plane"></i></button>
                    </div>
                </div>
            `;
            document.getElementById('main-content').innerHTML = html;
            const scroll = document.getElementById('chat-scroll');
            scroll.scrollTop = scroll.scrollHeight;
        }

        function sendMessage(chatId) {
            const input = document.getElementById('chat-input');
            if(!input.value.trim()) return;

            const chat = chats.find(c => c.id === chatId);
            const timeStr = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            chat.messages.push({ sender: currentUser.nickname, text: input.value.trim(), time: timeStr });
            chat.lastMessage = input.value.trim();
            saveData();
            openChatRoom(chatId);
        }

                        <div>
                            <h3 class="font-bold text-base tracking-tight">${currentUser.nickname}</h3>
                            <p class="text-xs text-emerald-100 mt-0.5 font-medium"><i class="fa-solid fa-graduation-cap mr-1"></i>${currentUser.university}</p>
                        </div>
                    </div>

                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                        <h4 class="font-bold text-xs text-slate-800 mb-3 flex items-center"><i class="fa-solid fa-pen-to-square mr-1.5 text-emerald-600 text-sm"></i>내가 작성한 게시글 (${myPosts.length}개)</h4>
                        <div class="space-y-2 max-h-56 overflow-y-auto">
            `;

            if(myPosts.length === 0) {
                html += `<p class="text-xs text-slate-400 py-6 text-center">작성한 게시글이 없습니다.</p>`;
            } else {
                myPosts.forEach(p => {
                    html += `
                        <div onclick="openDetail(${p.id})" class="p-3 bg-slate-50 hover:bg-slate-100 rounded-xl cursor-pointer flex justify-between items-center border border-slate-100 transition">
                            <div>
                                <span class="text-[10px] text-emerald-700 font-bold">${p.category==='request'?'필요요청':p.category==='rent'?'물품대여':'무료나눔'}</span>
                                <h5 class="text-xs font-bold text-slate-800 mt-0.5">${p.title}</h5>
                            </div>
                            <span class="text-[10px] bg-white border border-slate-200 px-2.5 py-1 rounded-full text-slate-600 font-bold">${p.status}</span>
                        </div>
                    `;
                });
            }

            html += `
                        </div>
                    </div>

                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 text-xs space-y-3 text-slate-700 font-semibold">
                        <div class="flex justify-between py-2 border-b border-slate-50 cursor-pointer hover:text-emerald-600"><span>이용 규칙 및 가이드</span><i class="fa-solid fa-chevron-right text-slate-400 text-[10px]"></i></div>
                        <div class="flex justify-between py-2 border-b border-slate-50 cursor-pointer hover:text-emerald-600"><span>안전한 교내 거래 수칙</span><i class="fa-solid fa-chevron-right text-slate-400 text-[10px]"></i></div>
                        <div onclick="logout()" class="flex justify-between py-2 text-rose-500 font-bold cursor-pointer hover:text-rose-600"><span>계정 로그아웃 / 초기화</span><i class="fa-solid fa-arrow-right-from-bracket"></i></div>
                    </div>
                </div>
            `;
            document.getElementById('main-content').innerHTML = html;
        }

        function logout() {
            if(confirm('로그아웃 하시겠습니까?')) {
                localStorage.removeItem('nanumi_user');
                currentUser = null;
                renderAuthScreen();
            }
        }
    </script>
</body>
</html>
